# Compile-checks the runtime's C files for Windows x64 (tools/check_windows_compile.sh): the first step of the PC build
# (docs/PC-BUILD.md). It runs on the pushes to the working branches and fails when a file that compiled for Windows
# stops compiling (the files still expected to fail are listed in the script).
name: Windows compile check

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

concurrency:
  group: windows-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the runtime for Windows x64
        run: tools/check_windows_compile.sh -v

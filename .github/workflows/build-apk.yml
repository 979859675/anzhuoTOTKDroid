# Builds the debug APK (arm64-v8a) on GitHub's runner and uploads it as the "totkdroid-debug-apk" artifact.
# The APK is built without the GPL LSFG folder (-PtotkLsfg=false, MIT as a whole; see NOTICE.md). The game's files
# are not in the APK: they are pushed to the phone separately (README: push_game.sh).
name: Build debug APK

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner's own Android SDK (ANDROID_HOME); the NDK and CMake the build needs are added to it.
      - name: Install the NDK and CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;30.0.16248370" "cmake;3.30.4"

      # The native dependencies (SDL3, shaderc, the headers, the font): android/deps/build_deps.sh. Cached by its
      # script and patch, so a rebuild with unchanged deps skips the long shaderc build.
      - name: Cache the native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: android/deps/out
          key: deps-${{ hashFiles('android/deps/build_deps.sh', 'android/deps/sdl-aaudio-resume.patch') }}

      - name: Build the native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash android/deps/build_deps.sh

      - name: Build the APK
        id: gradle
        working-directory: android/totkrecompandroid
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          set +e
          ./gradlew assembleDebug -PtotkLsfg=false --no-daemon > "$LOG" 2>&1
          status=$?
          set -e
          tail -n 60 "$LOG"
          if [ "$status" -ne 0 ]; then
            # the failing lines as annotations (readable through the API when the logs are not)
            grep -E "^e: |error|FAILED|What went wrong|Execution failed|Could not|Caused by" "$LOG" | head -n 25 \
              | while IFS= read -r l; do echo "::error title=build::$(echo "$l" | cut -c1-900)"; done
            exit "$status"
          fi

      - name: Keep the Gradle log
        if: always()
        run: cp "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/gradle-log.txt" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle-log.txt
          if-no-files-found: ignore

      - name: Find the APK
        id: apk
        run: echo "path=$(ls android/totkrecompandroid/app/build/outputs/apk/debug/*.apk | head -n 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: totkdroid-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
